name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Windows Clang Debug
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset x64-debug-win-clang
      - name: Build
        run: cmake --build out/build/x64-debug-win-clang --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir out/build/x64-debug-win-clang -C Debug --output-on-failure

  test-ubuntu:
    name: Ubuntu Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libfreetype-dev libsdl2-dev libsdl2-image-dev libglu-dev libglew-dev libossp-uuid-dev libyaml-cpp-dev
      - name: Configure
        run: cmake -S . -B out/build/ci-ubuntu -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out/build/ci-ubuntu --parallel 2
      - name: Test
        run: ctest --test-dir out/build/ci-ubuntu --output-on-failure

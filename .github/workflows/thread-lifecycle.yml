name: Thread lifecycle tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-14
            compiler: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test startup and shutdown with ASan and UBSan
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tools/test_thread_lifecycle.py --compiler "${{ matrix.compiler }}" --sanitizer
